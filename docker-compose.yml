# 一体化编排：自带 PostgreSQL（适合自托管/快速验证）
# 京东云生产建议改用 RDS：删掉 db 服务，把 api 的 DATABASE_URL 指向 RDS 连接串
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-joycrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?需在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-joycrm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-joycrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-joycrm}:${DB_PASSWORD}@db:5432/${DB_NAME:-joycrm}?schema=public
      JWT_SECRET: ${JWT_SECRET:?需在 .env 设置 JWT_SECRET}
      JWT_EXPIRES_IN: "2h"
      FIELD_ENC_KEY: ${FIELD_ENC_KEY:?需在 .env 设置 FIELD_ENC_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      NODE_ENV: production
    expose:
      - "3000"

  web:
    build: .
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
